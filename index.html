		<script type="text/javascript">
		/**
		 * 是否為本地／區網測試環境
		 * 以 hostname 白名單判斷，不依賴 UA
		 * （UA 在微信、Line、各手機瀏覽器都會被改寫，判斷不準）
		 * @returns {boolean}
		 */
		function isLocalTest() {
			var host = location.hostname;

			// 直接開檔測試（file://）：部分瀏覽器 hostname 會是空字串
			if (location.protocol === "file:" || host === "") {
				return true;
			}

			// 本機
			if (host === "localhost" || host === "127.0.0.1" || host === "0.0.0.0") {
				return true;
			}

			// IPv6 本機：瀏覽器回傳時帶中括號
			if (host === "[::1]") {
				return true;
			}

			// 私有網段：手機連電腦、公司內網（10.x / 172.16-31.x / 192.168.x）
			if (/^(10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)$/.test(host)) {
				return true;
			}

			// mDNS 名稱，例如 Mac 的 xxx.local
			if (host.slice(-6) === ".local") {
				return true;
			}

			return false;
		}

		/**
		 * 是否手動帶了 ?debug=1（不用 URLSearchParams，相容舊 WebView）
		 * @returns {boolean}
		 */
		function hasDebugFlag() {
			return /[?&]debug(=|&|$)/.test(location.search);
		}

		// 本地測試、或手動帶 ?debug=1 時，載入 eruda 行動端除錯面板
		var isDebug = isLocalTest() || hasDebugFlag();
		isDebug = false;// FIXME 临时关闭控制台
		if (isDebug) {
			var elem = document.createElement("script");
			elem.setAttribute("type", "text/javascript");
			elem.setAttribute("src", "js/eruda.min.js"); // 相對路徑，避開 context-path 問題
			elem.onload = function() {
				if (window.eruda) {
					window.eruda.init();
				}
			};
			document.body.appendChild(elem); // 先綁 onload 再插入，避免快取命中時漏掉 load 事件
		}
		</script>
